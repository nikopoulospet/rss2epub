[project]
name = "rss2epub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "ebooklib>=0.18",
    "lxml>=4.9",
]

[project.scripts]
rss2epub = "rss2epub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
