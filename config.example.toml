[server]
url      = "https://rss.example.com"
username = "peter"
# API password is read from env: RSS2EPUB_API_PASSWORD  (never put secrets in this file)

[fetch]
lookback = "30d"   # re-examine articles published within this window; accepts d, h, w (e.g. "7d", "72h", "2w")

[epub]
stylesheet = ""    # optional path to a CSS file for reader typography; empty = no stylesheet

[output]
dir    = "~/rss2epub/out"        # where .epub files are written (one per article)
db     = "~/rss2epub/catalog.db" # SQLite catalog tracking content hashes and filenames
# format = "{publish_date}/{article_name}"  # default: date-based subdirectories
# Available fields: article_name, publish_date, feed_name, author
# A "/" in the template creates a subdirectory; "/" inside a field value is sanitized away.
# Each filename always ends with a short item_id hash for uniqueness.
# Power-user example:
# format = "{feed_name}/{publish_date}_{article_name}"

# ── Content resolvers ──────────────────────────────────────────────────────────
# Resolvers transform article HTML between fetch and EPUB build.
# A resolver is enabled by the presence of its section below.
# Remove or comment out a section to disable that resolver entirely.
# Resolvers fail soft: a broken resolver never prevents an article from rendering.

# [twitter-link]
# replacement = "A fucking twitter link"   # text substituted for all Twitter/X embeds and links

# [image-inline]
# timeout   = 10       # per-image HTTP timeout in seconds (default: 10)
# max_bytes = 5242880  # skip images larger than this in bytes (default: 5 MB)
