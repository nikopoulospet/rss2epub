[server]
url      = "https://rss.example.com"
username = "peter"
# API password is read from env: RSS2EPUB_API_PASSWORD  (never put secrets in this file)

[fetch]
lookback = "30d"   # re-examine articles published within this window; accepts d, h, w (e.g. "7d", "72h", "2w")

[epub]
stylesheet = ""    # optional path to a CSS file for reader typography; empty = no stylesheet

[output]
dir = "~/rss2epub/out"        # where .epub files are written (one per article)
db  = "~/rss2epub/catalog.db" # SQLite catalog tracking content hashes and filenames
